<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saturday Bonus OT Calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.css" />
</head>
<body>
  <div id="root">
    <p style="font-family: sans-serif; padding: 2rem;">
      Loading Python in your browser &mdash; takes about 10&ndash;20 seconds the first time&hellip;
    </p>
  </div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";
    mount(
      {
        requirements: ["pandas", "openpyxl"],
        entrypoint: "app.py",
        files: {
          "app.py": { url: "./app.py" },
        },
      },
      document.getElementById("root")
    );
  </script>
</body>
</html>
